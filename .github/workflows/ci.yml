name: core-validation
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils make python3
      - name: Compile freestanding kernel and user programs; run parser tests
        run: make -j2 CROSS= kernel test
# BIOS/QEMU integration: make smoke (requires an installed Limine distribution).
